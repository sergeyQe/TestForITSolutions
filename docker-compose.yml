name: digital-business-card

services:
  # База данных. Порт наружу не публикуется: для локальной разработки его открывает docker-compose.dev.yml
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-card}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-card}
      POSTGRES_DB: ${POSTGRES_DB:-card}
    healthcheck:
      # Проверка по TCP, а не через сокет: временный сервер первой инициализации по TCP не отвечает
      test:
        [
          'CMD-SHELL',
          'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
